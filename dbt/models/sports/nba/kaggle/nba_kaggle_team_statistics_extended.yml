version: 2
models:
  - name: nba_kaggle_team_statistics_extended
    columns:
      - name: game_id
        description: Unique identifier for the NBA game.
        data_type: INT64
      - name: game_datetime_est
        data_type: TIMESTAMP
      - name: game_type
        description: Game type from the source.
        data_type: STRING
